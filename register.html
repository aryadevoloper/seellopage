<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="style.css"><title>Daftar - Seello</title></head><body><div class="auth"><div class="box">
<div class="brand"><span class="logo"><i class="fa-solid fa-server"></i></span>Seello</div><p class="sub">Buat akun baru</p>
<div class="card"><label>Username</label><input id="u" autocomplete="username" placeholder="3-20 huruf, angka, _"><label>Password</label><input id="p" type="password" autocomplete="new-password" placeholder="Minimal 4 karakter"><label>Ulangi password</label><input id="p2" type="password" autocomplete="new-password">
<button onclick="reg()"><i class="fa-solid fa-user-plus"></i>Daftar</button><div id="am" class="msg"></div></div>
<div class="switch">Sudah punya akun? <a href="login.html">Masuk</a></div></div></div>
<script src="app.js"></script><script>
async function reg(){if($('p').value!==$('p2').value)return say('am','Password tidak sama',1);
try{await api('register',{username:$('u').value,password:$('p').value});say('am','Akun dibuat, mengarahkan ke halaman masuk...');setTimeout(()=>location='login.html',1200)}catch(e){say('am',e.message,1)}}
</script></body></html>
