<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="style.css"><title>Pengaturan - Seello</title></head><body><header id="top"></header><main>
<h1>Pengaturan</h1><p class="sub">Kelola server, API key, dan role user.</p>
<div class="card"><h2>Server</h2><div id="sl"></div><button class="alt" onclick="openForm({})"><i class="fa-solid fa-plus"></i>Tambah server</button></div>
<div id="fm" class="card hide"><h2 id="ft">Server</h2><input type="hidden" id="fid">
<label>Nama server</label><input id="fn" placeholder="Server 1"><label>Domain panel</label><input id="fd" placeholder="https://panel.domain.com"><label>API Application (ptla_...)</label><input id="fa"><label>API Client (ptlc_...)</label><input id="fc"><label>Location ID</label><input id="fl" type="number" value="1">
<label>Pilihan aplikasi untuk pengguna</label><p class="sub" style="margin:0 0 6px;font-size:13px">Centang yang boleh dipilih dan beri nama singkat, misalnya Node.js atau Python.</p><div id="eggs"></div><button class="alt" onclick="loadEggs()"><i class="fa-solid fa-cloud-arrow-down"></i>Ambil daftar dari server</button><button onclick="saveSv()"><i class="fa-solid fa-floppy-disk"></i>Simpan</button><button class="alt" onclick="$('fm').classList.add('hide')">Batal</button><div id="fmsg" class="msg"></div></div>
<div class="card"><h2>Role pengguna</h2><div class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="uq" placeholder="Cari username" oninput="findUsers()" autocomplete="off"></div><div id="ul" style="margin-top:8px"></div></div></main><nav id="bot"></nav>
<script src="app.js"></script><script>
let S=[],EG=[];const esc=t=>String(t).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
function picked(){const o={};document.querySelectorAll('#eggs [data-id]').forEach(c=>{if(c.checked)o[c.dataset.id]=document.querySelector('#eggs [data-l="'+c.dataset.id+'"]').value});return o}
function renderEggs(P){$('eggs').innerHTML=EG.length?EG.map(e=>`<div class="eg"><label><input type="checkbox" data-id="${esc(e.id)}" ${P[e.id]!==undefined?'checked':''}>${esc(e.name)}</label><input type="text" data-l="${esc(e.id)}" value="${esc(P[e.id]??e.name.split(' - ').pop())}"></div>`).join(''):'<p class="empty">Belum ada. Simpan server dulu, lalu ambil daftar.</p>'}
async function loadEggs(){if(!$('fid').value)return say('fmsg','Simpan server dulu, lalu edit untuk ambil daftar',1);say('fmsg','Mengambil...');try{const P=picked();EG=await api('eggs/all?server='+$('fid').value);renderEggs(P);say('fmsg','')}catch(e){say('fmsg',e.message,1)}}
init(['owner']).then(m=>{if(m){loadSv();loadUsers()}});
async function loadSv(){S=await api('settings');$('sl').innerHTML=S.length?S.map(v=>`<div class="row"><div><b>${v.name}</b><div class="mu">${v.domain}</div><div id="t${v.id}" class="mu"></div></div><div class="acts"><button class="sm alt" onclick="testSv('${v.id}')"><i class="fa-solid fa-plug"></i></button><button class="sm alt" onclick="editSv('${v.id}')"><i class="fa-solid fa-pen"></i></button><button class="sm alt del" onclick="delSv('${v.id}')"><i class="fa-solid fa-trash"></i></button></div></div>`).join(''):'<p class="empty">Belum ada server. Tambah yang pertama.</p>'}
function openForm(v){$('fm').classList.remove('hide');$('fid').value=v.id||'';$('fn').value=v.name||'';$('fd').value=v.domain||'';$('fa').value=v.plta||'';$('fc').value=v.pltc||'';$('fl').value=v.location||1;$('ft').textContent=v.id?'Edit server':'Tambah server';EG=(v.eggs||[]).map(e=>({id:e.id,name:e.name}));const P={};(v.eggs||[]).forEach(e=>P[e.id]=e.name);renderEggs(P);say('fmsg','');$('fm').scrollIntoView({behavior:'smooth'})}
function editSv(id){openForm(S.find(x=>x.id===id))}
async function saveSv(){try{await api('settings',{id:$('fid').value,name:$('fn').value,domain:$('fd').value,plta:$('fa').value,pltc:$('fc').value,location:$('fl').value,eggs:Object.entries(picked()).map(([id,name])=>({id,name}))});$('fm').classList.add('hide');loadSv()}catch(e){say('fmsg',e.message,1)}}
async function delSv(id){if(confirm('Hapus server ini?')){await api('settings',{del:id});loadSv()}}
async function testSv(id){const t=$('t'+id);t.className='mu';t.textContent='Mengecek...';try{await api('check',{id});t.className='mu ok';t.textContent='Server siap'}catch(e){t.className='mu err';t.textContent=e.message}}
let tm;function findUsers(){clearTimeout(tm);tm=setTimeout(loadUsers,250)}
async function loadUsers(){const l=await api('users?q='+encodeURIComponent($('uq').value.trim()));$('ul').innerHTML=l.length?l.map(u=>`<div class="row"><div class="pi"><b>${h(u.name)}</b><div class="mu">@${h(u.username)}</div></div><select onchange="setRole('${u.username}',this.value)">${['user','admin','owner'].map(r=>`<option ${r===u.role?'selected':''}>${r}</option>`).join('')}</select></div>`).join(''):'<p class="empty">Tidak ada pengguna.</p>'}
async function setRole(u,r){try{await api('role',{username:u,role:r})}catch(e){alert(e.message);loadUsers()}}
</script></body></html>
