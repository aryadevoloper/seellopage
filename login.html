<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="style.css"><title>Masuk - Seello</title></head><body><div class="auth"><div class="box">
<div class="brand"><span class="logo"><i class="fa-solid fa-server"></i></span>Seello</div><p class="sub">Masuk untuk membuat panel gratis</p>
<div class="card"><label>Username</label><input id="u" autocomplete="username"><label>Password</label><input id="p" type="password" autocomplete="current-password">
<button onclick="login()"><i class="fa-solid fa-right-to-bracket"></i>Masuk</button><div id="am" class="msg"></div></div>
<div class="switch">Belum punya akun? <a href="register.html">Daftar</a></div></div></div>
<script src="app.js"></script><script>
if(T)api('me').then(()=>location='home.html').catch(()=>{});
document.addEventListener('keydown',e=>{if(e.key==='Enter')login()});
async function login(){try{const j=await api('login',{username:$('u').value,password:$('p').value});localStorage.token=j.token;location='home.html'}catch(e){say('am',e.message,1)}}
</script></body></html>
